# Trivy scans for HIGH/CRITICAL CVEs; blocks on main/release, advisory on PRs.
# Last verified clean: 2026-05-08 17:50 CST.
name: "Container Image Security Scan"

on:
  pull_request:
    paths:
      - "src/**/Dockerfile"
      - ".github/workflows/security-image-scan-ci.yaml"
  push:
    branches: ["main", "release/**"]
    paths:
      - "src/**/Dockerfile"
      - ".github/workflows/security-image-scan-ci.yaml"

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set exit code based on branch
        id: exit-code
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main || "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "code=1" >> "$GITHUB_OUTPUT"
          else
            echo "code=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: ${{ steps.exit-code.outputs.code }}
