global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: flink-jobmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["flink-jobmanager:8081"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: stream-metrics-exporter
    static_configs:
      - targets: ["stream-metrics-exporter:9108"]

  - job_name: connect-monitor-exporter
    static_configs:
      - targets: ["connect-monitor-exporter:9310"]

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6334"]

  - job_name: elasticsearch
    metrics_path: /metrics
    static_configs:
      - targets: ["elasticsearch:9200"]
