{{- if .Values.streamMetricsExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "realtime-data-pipeline.fullname" . }}-stream-metrics-exporter
  labels:
    {{- include "realtime-data-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streamMetricsExporter.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: stream-metrics-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: stream-metrics-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "realtime-data-pipeline.labels" . | nindent 8 }}
    spec:
      containers:
        - name: stream-metrics-exporter
          image: {{ .Values.streamMetricsExporter.image }}
          imagePullPolicy: {{ .Values.streamMetricsExporter.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >
              pip install --no-cache-dir kafka-python==2.0.2 prometheus-client==0.20.0 &&
              python -u /app/metrics_exporter.py
          env:
            - name: METRICS_PORT
              value: {{ .Values.streamMetricsExporter.service.port | quote }}
            {{- range $k, $v := .Values.streamMetricsExporter.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.streamMetricsExporter.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: exporter-script
              mountPath: /app/metrics_exporter.py
              subPath: metrics_exporter.py
      volumes:
        - name: exporter-script
          configMap:
            name: {{ include "realtime-data-pipeline.fullname" . }}-stream-metrics-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "realtime-data-pipeline.fullname" . }}-stream-metrics-script
  labels:
    {{- include "realtime-data-pipeline.labels" . | nindent 4 }}
data:
  metrics_exporter.py: |
{{ .Files.Get "scripts/metrics_exporter.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realtime-data-pipeline.fullname" . }}-stream-metrics-exporter
  labels:
    {{- include "realtime-data-pipeline.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: stream-metrics-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.streamMetricsExporter.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
{{- end }}
